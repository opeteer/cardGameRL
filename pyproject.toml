[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "big_two_rl"
version = "0.1.0"
description = "Multi-Agent Reinforcement Learning for Capsa Banting (Big Two)"
authors = [{ name = "opeteer" }]
dependencies = [
    "numpy>=1.24.0",
    "gymnasium>=0.29.0",
    "pettingzoo>=1.24.0",
    "pygame-ce>=2.5.0",
    "sb3-contrib>=2.0.0",
    "stable-baselines3>=2.0.0",
    "torch>=2.0.0",
    "pillow>=10.0.0",
]

[tool.setuptools.packages.find]
include = ["big_two_rl*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
